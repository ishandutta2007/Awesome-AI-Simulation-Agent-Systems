<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a071b"/>
      <stop offset="50%" stop-color="#0e0c28"/>
      <stop offset="100%" stop-color="#070514"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2e2560" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1" fill="#4f46e5" fill-opacity="0.5"/>
    </pattern>

    <!-- Filters -->
    <filter id="glow-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <filter id="pill-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.7; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(8px); }
    }
    @keyframes orbitNode {
      0% { transform: rotate(0deg) translateX(70px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(70px) rotate(-360deg); }
    }
    @keyframes agentWave {
      0%, 100% { stroke-dashoffset: 0; }
      50% { stroke-dashoffset: 80; }
    }
    .anim-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .anim-orb-2 { animation: pulseOrb 10s ease-in-out infinite 2s; transform-origin: 1000px 300px; }
    .anim-float { animation: floatParticle 5s ease-in-out infinite; }
    .anim-float-delayed { animation: floatParticle 6s ease-in-out infinite 2.5s; }
    .anim-wave { stroke-dasharray: 8 12; animation: agentWave 14s linear infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 500; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-weight: 600; font-size: 13px; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/>
  <rect width="1200" height="420" fill="url(#grid)" rx="16"/>

  <!-- Dynamic / Animated Background Glow Orbs (Behind All Text) -->
  <g opacity="0.6">
    <circle class="anim-orb-1" cx="220" cy="110" r="160" fill="#7c3aed" filter="url(#glow-blur)"/>
    <circle class="anim-orb-2" cx="980" cy="290" r="180" fill="#0284c7" filter="url(#glow-blur)"/>
    <circle class="anim-float" cx="620" cy="380" r="140" fill="#9333ea" filter="url(#glow-blur)" opacity="0.3"/>
  </g>

  <!-- Dynamic Agent Network Constellations (Background Simulation Mesh) -->
  <g opacity="0.35">
    <path class="anim-wave" d="M 80,60 Q 250,160 450,90 T 820,130 T 1140,80" fill="none" stroke="#60a5fa" stroke-width="1.8"/>
    <path class="anim-wave" d="M 60,340 Q 300,240 600,320 T 950,260 T 1150,350" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
    
    <!-- Simulation Agent Nodes -->
    <g class="anim-float">
      <circle cx="150" cy="80" r="4" fill="#38bdf8"/>
      <circle cx="150" cy="80" r="9" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <circle cx="1080" cy="110" r="4" fill="#a855f7"/>
      <circle cx="1080" cy="110" r="9" fill="none" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    </g>
    <g class="anim-float-delayed">
      <circle cx="120" cy="310" r="4" fill="#818cf8"/>
      <circle cx="1040" cy="330" r="4" fill="#34d399"/>
      <circle cx="1040" cy="330" r="9" fill="none" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
    </g>
  </g>

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="1196" height="416" rx="15" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- FOREGROUND CONTENT: Guaranteed Clear & Legible Above All Dynamic Elements -->
  
  <!-- Category Kicker Pill -->
  <g transform="translate(600, 75)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#1e1846" stroke="#6366f1" stroke-width="1.2" filter="url(#pill-glow)" fill-opacity="0.9"/>
    <circle cx="-165" cy="0" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text class="badge-text" x="5" y="5" fill="#c7d2fe" text-anchor="middle" letter-spacing="1.5">⚡ CURATED ECOSYSTEM ARCHIVE ⚡</text>
  </g>

  <!-- Foreground Main Title -->
  <g transform="translate(600, 155)">
    <text class="title-text" x="0" y="0" text-anchor="middle" font-size="44" fill="url(#primary-glow)" letter-spacing="-0.5">
      Awesome AI Simulation &amp; Agent Systems
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 205)">
    <text class="sub-text" x="0" y="0" text-anchor="middle" font-size="18" fill="#cbd5e1" letter-spacing="0.2">
      Multi-Agent Swarm Simulations • Digital Societies • Autonomous Software Orgs • Synthetic Behavior
    </text>
  </g>

  <!-- Foreground Interactive-Style Topic Cards/Pills (Static & Legible in Foreground) -->
  <g transform="translate(600, 280)">
    <!-- Pill 1: Swarm Simulations -->
    <g transform="translate(-410, 0)">
      <rect x="0" y="0" width="190" height="42" rx="10" fill="#161336" stroke="#4338ca" stroke-width="1.2" fill-opacity="0.95"/>
      <text class="badge-text" x="95" y="26" fill="#93c5fd" text-anchor="middle">🌐 Swarm Simulators</text>
    </g>

    <!-- Pill 2: Agent Societies -->
    <g transform="translate(-200, 0)">
      <rect x="0" y="0" width="190" height="42" rx="10" fill="#161336" stroke="#6d28d9" stroke-width="1.2" fill-opacity="0.95"/>
      <text class="badge-text" x="95" y="26" fill="#c4b5fd" text-anchor="middle">🏛️ Agent Societies</text>
    </g>

    <!-- Pill 3: Virtual Companies -->
    <g transform="translate(10, 0)">
      <rect x="0" y="0" width="190" height="42" rx="10" fill="#161336" stroke="#0e7490" stroke-width="1.2" fill-opacity="0.95"/>
      <text class="badge-text" x="95" y="26" fill="#67e8f9" text-anchor="middle">🏢 Virtual Dev Orgs</text>
    </g>

    <!-- Pill 4: Agentic Orchestration -->
    <g transform="translate(220, 0)">
      <rect x="0" y="0" width="190" height="42" rx="10" fill="#161336" stroke="#047857" stroke-width="1.2" fill-opacity="0.95"/>
      <text class="badge-text" x="95" y="26" fill="#6ee7b7" text-anchor="middle">🔄 Graph Orchestration</text>
    </g>
  </g>

  <!-- Bottom Footer Line in Foreground -->
  <g transform="translate(600, 360)">
    <text class="badge-text" x="0" y="0" fill="#94a3b8" text-anchor="middle" font-size="13" letter-spacing="1">
      SaaS Platforms &amp; Open-Source Repositories • Real-Time Metrics • Continuous Updates
    </text>
  </g>
</svg>
