<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a071b"/><stop offset="50%" stop-color="#0e0c28"/><stop offset="100%" stop-color="#070514"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="accent-purple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#6366f1" stop-opacity=".2"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".3"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".3"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#2e2560" stroke-opacity=".4" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#4f46e5" fill-opacity=".5"/></pattern><filter id="glow-blur" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="35"/></filter><filter id="pill-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.15) translate(25px,-15px);opacity:.7}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-12px) translateX(8px)}}@keyframes orbitNode{0%{transform:rotate(0deg) translateX(70px) rotate(0deg)}}@keyframes agentWave{0%{stroke-dashoffset:0}50%{stroke-dashoffset:80}}.anim-orb-1{animation:pulseOrb 8s ease-in-out infinite;transform-origin:200px 100px}.anim-orb-2{animation:pulseOrb 10s ease-in-out infinite 2s;transform-origin:1000px 300px}.anim-float{animation:floatParticle 5s ease-in-out infinite}.anim-float-delayed{animation:floatParticle 6s ease-in-out infinite 2.5s}.anim-wave{stroke-dasharray:8 12;animation:agentWave 14s linear infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title-text{font-weight:800}.sub-text{font-weight:500}.badge-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:600;font-size:13px}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g opacity=".6"><circle cx="220" cy="110" r="160" fill="#7c3aed" class="anim-orb-1" filter="url(#glow-blur)"/><circle cx="980" cy="290" r="180" fill="#0284c7" class="anim-orb-2" filter="url(#glow-blur)"/><circle cx="620" cy="380" r="140" fill="#9333ea" class="anim-float" filter="url(#glow-blur)" opacity=".3"/></g><g opacity=".35"><path fill="none" stroke="#60a5fa" stroke-width="1.8" d="M 80,60 Q 250,160 450,90 T 820,130 T 1140,80" class="anim-wave"/><path fill="none" stroke="#a78bfa" stroke-width="1.8" d="M 60,340 Q 300,240 600,320 T 950,260 T 1150,350" class="anim-wave"/><g class="anim-float"><circle cx="150" cy="80" r="4" fill="#38bdf8"/><circle cx="150" cy="80" r="9" fill="none" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1"/><circle cx="1080" cy="110" r="4" fill="#a855f7"/><circle cx="1080" cy="110" r="9" fill="none" stroke="#a855f7" stroke-opacity=".6" stroke-width="1"/></g><g class="anim-float-delayed"><circle cx="120" cy="310" r="4" fill="#818cf8"/><circle cx="1040" cy="330" r="4" fill="#34d399"/><circle cx="1040" cy="330" r="9" fill="none" stroke="#34d399" stroke-opacity=".6" stroke-width="1"/></g></g><rect width="1196" height="416" x="2" y="2" fill="none" stroke="#4f46e5" stroke-opacity=".3" stroke-width="1.5" rx="15"/><g transform="translate(600, 75)"><rect width="380" height="36" x="-190" y="-18" fill="#1e1846" fill-opacity=".9" stroke="#6366f1" stroke-width="1.2" filter="url(#pill-glow)" rx="18"/><circle cx="-165" cy="0" r="4" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="5" y="5" fill="#c7d2fe" class="badge-text" letter-spacing="1.5" text-anchor="middle">⚡ CURATED ECOSYSTEM ARCHIVE ⚡</text></g><g><text x="0" y="0" fill="url(#primary-glow)" class="title-text" font-size="44" letter-spacing="-.5" text-anchor="middle" transform="translate(600, 155)">Awesome AI Simulation &amp; Agent Systems</text></g><g><text x="0" y="0" fill="#cbd5e1" class="sub-text" font-size="18" letter-spacing=".2" text-anchor="middle" transform="translate(600, 205)">Multi-Agent Swarm Simulations • Digital Societies • Autonomous Software Orgs • Synthetic Behavior</text></g><g><g transform="translate(600, 280) translate(-410, 0)"><rect width="190" height="42" x="0" y="0" fill="#161336" fill-opacity=".95" stroke="#4338ca" stroke-width="1.2" rx="10"/><text x="95" y="26" fill="#93c5fd" class="badge-text" text-anchor="middle">🌐 Swarm Simulators</text></g><g transform="translate(600, 280) translate(-200, 0)"><rect width="190" height="42" x="0" y="0" fill="#161336" fill-opacity=".95" stroke="#6d28d9" stroke-width="1.2" rx="10"/><text x="95" y="26" fill="#c4b5fd" class="badge-text" text-anchor="middle">🏛️ Agent Societies</text></g><g transform="translate(600, 280) translate(10, 0)"><rect width="190" height="42" x="0" y="0" fill="#161336" fill-opacity=".95" stroke="#0e7490" stroke-width="1.2" rx="10"/><text x="95" y="26" fill="#67e8f9" class="badge-text" text-anchor="middle">🏢 Virtual Dev Orgs</text></g><g transform="translate(600, 280) translate(220, 0)"><rect width="190" height="42" x="0" y="0" fill="#161336" fill-opacity=".95" stroke="#047857" stroke-width="1.2" rx="10"/><text x="95" y="26" fill="#6ee7b7" class="badge-text" text-anchor="middle">🔄 Graph Orchestration</text></g></g><g><text x="0" y=